<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>AIChE Plant Arcade</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="start-page">
  <main class="start-shell">
    <div class="start-grid" aria-hidden="true"></div>
    <section class="hero start-hero">
      <div class="small">UNIVERSITY OF BAHRAIN · AIChE STUDENT CHAPTER</div>
      <h1>PLANT<br><span>ARCADE</span></h1>
      <p id="startTagline">Two chemical-engineering games. Twenty seconds. Beat the board.</p>
      <div class="control-badges" aria-label="Supported controls">
        <span>⌨️ Keyboard</span><span>👆 Touch</span><span>🎮 Controller</span>
      </div>
      <button id="startBtn" class="bigbtn start-button" type="button">START ▶</button>
      <div class="start-hint" id="startHint">Choose a challenge on the next screen.</div>
    </section>
  </main>
  <script src="js/start.js" defer></script>
</body>
</html>
